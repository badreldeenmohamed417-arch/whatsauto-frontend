<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Repleyo</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}</style><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen"><aside id="sidebar" class="app-sidebar"><a href="dashboard.html" class="app-brand">Repleyo Admin</a><nav class="app-nav"><a href="dashboard.html">⌂ <span>الرئيسية</span></a><a href="settings.html">⚙ <span>الإعدادات</span></a><a href="channels.html">◉ <span>القنوات</span></a><a href="chats.html">▣ <span>المحادثات</span></a><a class="active" href="admin.html">♙ <span>الإدارة</span></a></nav><div class="app-sidebar-footer"><a href="login.html" id="logout" class="app-nav app-logout">↪ <span>تسجيل الخروج</span></a></div></aside><div id="overlay" class="sidebar-overlay"></div><main class="app-main"><div class="max-w-6xl mx-auto p-6 md:p-10"><div class="app-topbar"><button class="sidebar-toggle" id="menuBtn">☰</button><span class="app-mobile-brand">Repleyo Admin</span><span></span></div><h1 class="text-3xl font-extrabold mb-8">المشتركون</h1><div id="users" class="space-y-3">جاري التحميل...</div></div></main>
<script src="config.js"></script><script>
const t=localStorage.getItem('repleyo_token');if(!t)location.href='login.html';document.getElementById('logout').onclick=()=>localStorage.removeItem('repleyo_token');const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');function toggleMenu(){sidebar.classList.toggle('open');overlay.classList.toggle('open')}menuBtn.onclick=toggleMenu;overlay.onclick=toggleMenu;
async function load(){const r=await fetch(API_BASE_URL+'/api/admin/users',{headers:{Authorization:'Bearer '+t}});if(r.status===403){document.getElementById('users').textContent=window.repleyoT('ليس لديك صلاحية');return}if(!r.ok)return;const ds=await r.json();document.getElementById('users').innerHTML=ds.map(u=>'<div class="bg-white border rounded-2xl p-5 flex flex-wrap items-center gap-4 justify-between"><div><b>'+esc(u.email)+'</b><div class="text-sm text-slate-500">ID: '+u.id+' • '+window.repleyoT(u.subscription_status==='ACTIVE'?'فعال':'منتهي')+(u.expires_at?' • '+new Date(u.expires_at).toLocaleDateString('ar-EG'):'')+'</div></div><div class="flex gap-2"><button onclick="activate('+u.id+')" class="bg-blue-600 text-white px-4 py-2 rounded-xl">'+window.repleyoT('+ شهر')+'</button><button onclick="disable('+u.id+')" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl">'+window.repleyoT('إيقاف')+'</button></div></div>').join('')}async function activate(id){await fetch(API_BASE_URL+'/api/admin/subscriptions/activate',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({user_id:id,months:1})});load()}async function disable(id){await fetch(API_BASE_URL+'/api/admin/subscriptions/disable',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({user_id:id,months:0})});load()}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}load();
</script><script src="i18n.js"></script></body></html>
