<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة WhatsAuto</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}</style></head>
<body class="bg-slate-50 min-h-screen"><div class="max-w-6xl mx-auto p-6 md:p-10"><header class="flex justify-between mb-8"><b class="text-2xl text-blue-600">WhatsAuto Admin</b><a href="dashboard.html">العودة</a></header><h1 class="text-3xl font-extrabold mb-8">المشتركون</h1><div id="users" class="space-y-3">جاري التحميل...</div></div>
<script src="config.js"></script><script>
const t=localStorage.getItem('whatsauto_token');if(!t)location.href='login.html';async function load(){const r=await fetch(API_BASE_URL+'/api/admin/users',{headers:{Authorization:'Bearer '+t}});if(r.status===403){document.getElementById('users').textContent='ليس لديك صلاحية';return}if(!r.ok)return;const ds=await r.json();document.getElementById('users').innerHTML=ds.map(u=>'<div class="bg-white border rounded-2xl p-5 flex flex-wrap items-center gap-4 justify-between"><div><b>'+esc(u.email)+'</b><div class="text-sm text-slate-500">ID: '+u.id+' • '+(u.subscription_status==='ACTIVE'?'فعال':'منتهي')+(u.expires_at?' • '+new Date(u.expires_at).toLocaleDateString('ar-EG'):'')+'</div></div><div class="flex gap-2"><button onclick="activate('+u.id+')" class="bg-blue-600 text-white px-4 py-2 rounded-xl">+ شهر</button><button onclick="disable('+u.id+')" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl">إيقاف</button></div></div>').join('')}async function activate(id){await fetch(API_BASE_URL+'/api/admin/subscriptions/activate',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({user_id:id,months:1})});load()}async function disable(id){await fetch(API_BASE_URL+'/api/admin/subscriptions/disable',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({user_id:id,months:0})});load()}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}load();
</script></body></html>
