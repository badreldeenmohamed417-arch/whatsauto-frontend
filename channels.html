<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>القنوات - WhatsAuto</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}</style></head>
<body class="bg-slate-50 min-h-screen text-slate-900">
<div class="max-w-5xl mx-auto p-6 md:p-10">
<header class="flex justify-between items-center mb-8"><a href="dashboard.html" class="text-2xl font-extrabold text-blue-600">WhatsAuto</a><a href="login.html" id="logout" class="text-red-500 font-semibold">تسجيل الخروج</a></header>
<h1 class="text-3xl font-extrabold mb-2">ربط القنوات</h1>
<p class="text-slate-500 mb-8">أدخل بيانات Meta الرسمية للحساب أو الصفحة. لا تستخدم كلمة مرور حسابك.</p>
<div class="grid md:grid-cols-2 gap-6">
<section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
<h2 class="text-xl font-bold mb-5">واتساب للأعمال</h2>
<label class="block font-semibold mb-1">Phone Number ID<input id="whatsapp_id" class="mt-2 w-full p-3 border rounded-xl ltr" dir="ltr"></label>
<label class="block font-semibold mt-4 mb-1">Access Token<input id="whatsapp_token" type="password" class="mt-2 w-full p-3 border rounded-xl" dir="ltr" placeholder="يتم تشفيره قبل التخزين"></label>
<button data-platform="whatsapp" class="connect mt-5 w-full bg-blue-600 text-white font-bold py-3 rounded-xl">حفظ وربط</button>
<p id="whatsapp_status" class="text-sm mt-3 text-slate-500">غير متصل</p>
</section><section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
<h2 class="text-xl font-bold mb-5">فيسبوك / Messenger</h2>
<label class="block font-semibold mb-1">Page ID<input id="facebook_id" class="mt-2 w-full p-3 border rounded-xl ltr" dir="ltr"></label>
<label class="block font-semibold mt-4 mb-1">Access Token<input id="facebook_token" type="password" class="mt-2 w-full p-3 border rounded-xl" dir="ltr" placeholder="يتم تشفيره قبل التخزين"></label>
<button data-platform="facebook" class="connect mt-5 w-full bg-blue-600 text-white font-bold py-3 rounded-xl">حفظ وربط</button>
<p id="facebook_status" class="text-sm mt-3 text-slate-500">غير متصل</p>
</section>
</div>
<div class="mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-5 text-sm text-amber-900">
<strong>مهم:</strong> هذه الشاشة تحفظ الـAccess Token مشفراً، لكن الربط الفعلي يحتاج Meta App وWebhooks مفعلة على حسابك.
</div>
</div>
<script src="config.js"></script><script>
const token=localStorage.getItem('whatsauto_token');if(!token)location.href='login.html';
document.getElementById('logout').onclick=()=>localStorage.removeItem('whatsauto_token');
async function load(){const r=await fetch(API_BASE_URL+'/api/channels/',{headers:{Authorization:'Bearer '+token}});if(r.status===401){location.href='login.html';return}const ds=await r.json();ds.forEach(c=>{const s=document.getElementById(c.platform+'_status');if(s){s.textContent=c.is_active?'متصل':'متوقف';s.className='text-sm mt-3 '+(c.is_active?'text-green-600':'text-slate-500')}})}
document.querySelectorAll('.connect').forEach(btn=>btn.onclick=async()=>{const p=btn.dataset.platform,id=document.getElementById(p+'_id').value.trim(),tok=document.getElementById(p+'_token').value.trim();if(!id||!tok){alert('أدخل المعرّف والـAccess Token');return}btn.disabled=true;btn.textContent='جاري الحفظ...';const r=await fetch(API_BASE_URL+'/api/channels/',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({platform:p,channel_id:id,token:tok})});alert(r.ok?'تم حفظ بيانات القناة. اختبر Webhook بعد إعداد Meta.':'فشل حفظ القناة');btn.disabled=false;btn.textContent='حفظ وربط';if(r.ok){document.getElementById(p+'_token').value='';load()}});
load();
</script></body></html>
