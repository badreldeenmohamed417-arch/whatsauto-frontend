<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحادثات - Repleyo</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}</style><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen"><aside id="sidebar" class="app-sidebar"><a href="dashboard.html" class="app-brand">Repleyo</a><nav class="app-nav"><a href="dashboard.html">⌂ <span>الرئيسية</span></a><a href="settings.html">⚙ <span>الإعدادات</span></a><a href="channels.html">◉ <span>القنوات</span></a><a class="active" href="chats.html">▣ <span>المحادثات</span></a></nav><div class="app-sidebar-footer"><a href="dashboard.html" class="app-nav">← <span>العودة</span></a><a href="login.html" id="logout" class="app-nav app-logout">↪ <span>تسجيل الخروج</span></a></div></aside><div id="overlay" class="sidebar-overlay"></div><main class="app-main"><div class="max-w-6xl mx-auto p-6 md:p-10"><div class="app-topbar"><button class="sidebar-toggle" id="menuBtn">☰</button><span class="app-mobile-brand">Repleyo</span><span></span></div><h1 class="text-3xl font-extrabold mb-8">المحادثات</h1><div id="list" class="space-y-4"></div></div></main>
<script src="config.js"></script><script>
const t=localStorage.getItem('repleyo_token');if(!t)location.href='login.html';const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');function toggleMenu(){sidebar.classList.toggle('open');overlay.classList.toggle('open')}menuBtn.onclick=toggleMenu;overlay.onclick=toggleMenu;document.getElementById('logout').onclick=()=>localStorage.removeItem('repleyo_token');
async function load(){const r=await fetch(API_BASE_URL+'/api/chats',{headers:{Authorization:'Bearer '+t}});if(!r.ok)return;const ds=await r.json();const el=document.getElementById('list');if(!ds.length){el.innerHTML='<div class="bg-white border rounded-2xl p-8 text-center text-slate-500">'+window.repleyoT('لا توجد محادثات بعد.')+'</div>';return}el.innerHTML=ds.map(c=>'<div class="bg-white border rounded-2xl p-5"><div class="flex justify-between"><strong>'+esc(c.customer_name||c.customer_id)+'</strong><span class="text-sm text-slate-500">'+esc(c.channel)+'</span></div><div class="mt-4 space-y-2">'+c.messages.map(m=>'<div class="p-3 rounded-xl '+(m.sender==='bot'?'bg-blue-50':'bg-slate-50')+'"><span class="font-bold">'+esc(m.sender==='bot'?'البوت':'العميل')+': </span>'+esc(m.content)+'</div>').join('')+'</div></div>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}load();
</script><script src="i18n.js"></script></body></html>
