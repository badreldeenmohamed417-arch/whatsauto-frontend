<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - WhatsAuto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .dir-ltr { direction: ltr; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <div class="flex-1 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <a href="index.html" class="text-3xl font-bold text-blue-600 mb-2 block hover:opacity-80 transition">WhatsAuto</a>
                <p class="text-slate-500">تسجيل الدخول لحسابك</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none dir-ltr transition" placeholder="email@example.com" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none dir-ltr transition" placeholder="••••••••" />
                </div>
                
                <button type="submit" class="w-full py-3 mt-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition shadow">
                    دخول
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <p class="text-slate-600 mb-2">ليس لديك حساب؟ <a href="register.html" class="text-blue-600 font-bold hover:underline">سجل الآن</a></p>
                <a href="#" onclick="alert('لإستعادة كلمة المرور، يرجى التواصل مع الدعم الفني عبر الواتساب على الرقم 01038387558'); return false;" class="text-slate-400 hover:text-slate-600 hover:underline transition">نسيت كلمة المرور؟</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = e.target.elements[0].value;
            const password = e.target.elements[1].value;
            const btn = e.target.querySelector('button');
            btn.textContent = 'جاري الدخول...';
            btn.disabled = true;

            try {
                // FastAPI OAuth2PasswordBearer expects form data: username and password
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const res = await fetch(API_BASE_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('whatsauto_token', data.access_token);
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.detail || 'فشل تسجيل الدخول. يرجى التحقق من البيانات.');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالخادم.');
            } finally {
                btn.textContent = 'دخول';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
