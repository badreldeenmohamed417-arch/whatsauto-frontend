<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإعدادات - WhatsAuto</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div class="max-w-5xl mx-auto p-6 md:p-10">
<header class="flex justify-between items-center mb-8">
<a href="dashboard.html" class="text-2xl font-extrabold text-blue-600">WhatsAuto</a>
<a href="login.html" id="logout" class="text-red-500 font-semibold">تسجيل الخروج</a>
</header>
<h1 class="text-3xl font-extrabold mb-2">إعدادات البوت</h1>
<p class="text-slate-500 mb-8">هذه البيانات هي التي يعتمد عليها البوت عند الرد على عملائك.</p>
<div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
<div class="grid gap-5">
<label>اسم الشركة<input id="company_name" class="mt-2 w-full p-3 border rounded-xl"></label>
<label>وصف الشركة<textarea id="description" rows="4" class="mt-2 w-full p-3 border rounded-xl" placeholder="ما الذي تقدمه الشركة؟"></textarea></label>
<label>المنتجات والخدمات<textarea id="products" rows="6" class="mt-2 w-full p-3 border rounded-xl" placeholder="اكتب المنتجات والأسعار والمعلومات التي يستطيع البوت استخدامها..."></textarea></label>
<label>تعليمات إضافية<textarea id="instructions" rows="4" class="mt-2 w-full p-3 border rounded-xl" placeholder="مثلاً: لا تذكر الخصومات إلا عند السؤال عنها."></textarea></label>
<div class="grid md:grid-cols-2 gap-5">
<label>لهجة الرد<select id="tone" class="mt-2 w-full p-3 border rounded-xl bg-white">
<option value="مصري عامي">مصري عامي</option><option value="خليجي">خليجي</option><option value="رسمي">رسمي</option>
</select></label>
<label>رقم التحويل لموظف<input id="handover_number" class="mt-2 w-full p-3 border rounded-xl" placeholder="2010..."></label>
</div>
<label class="flex items-center gap-3"><input id="is_active" type="checkbox" class="w-5 h-5" checked><span>تفعيل الرد الآلي</span></label>
<button id="save" class="bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">حفظ الإعدادات</button>
<p id="status" class="text-sm text-center"></p>
</div></div></div>
<script src="config.js"></script>
<script>
const token=localStorage.getItem('whatsauto_token'); if(!token) location.href='login.html';
document.getElementById('logout').onclick=()=>localStorage.removeItem('whatsauto_token');
const ids=['company_name','description','products','instructions','tone','handover_number','is_active'];
async function load(){
 const r=await fetch(API_BASE_URL+'/api/settings/bot',{headers:{Authorization:'Bearer '+token}});
 if(r.status===401){location.href='login.html';return}
 const d=await r.json(); ids.forEach(id=>{const e=document.getElementById(id); if(e.type==='checkbox')e.checked=d.is_active; else e.value=d[id]||''});
}
document.getElementById('save').onclick=async()=>{
 const b=document.getElementById('save'),s=document.getElementById('status'); b.disabled=true;b.textContent='جاري الحفظ...';
 const body={};ids.forEach(id=>{const e=document.getElementById(id);body[id]=e.type==='checkbox'?e.checked:e.value});
 const r=await fetch(API_BASE_URL+'/api/settings/bot',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});
 s.textContent=r.ok?'تم حفظ الإعدادات':'حدث خطأ أثناء الحفظ';s.className=r.ok?'text-green-600 text-sm text-center':'text-red-600 text-sm text-center';
 b.disabled=false;b.textContent='حفظ الإعدادات';
};
load();
</script>
</body></html>
