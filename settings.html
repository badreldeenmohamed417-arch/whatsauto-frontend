<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإعدادات - WhatsAuto</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div class="max-w-5xl mx-auto p-6 md:p-10">
<header class="flex justify-between items-center mb-8">
<a href="dashboard.html" class="text-2xl font-extrabold text-blue-600">WhatsAuto</a>
<a href="login.html" id="logout" class="text-red-500 font-semibold">تسجيل الخروج</a>
</header>
<h1 class="text-3xl font-extrabold mb-2">إعدادات البوت</h1>
<p class="text-slate-500 mb-8">هذه البيانات هي التي يعتمد عليها البوت عند الرد على عملائك.</p>
<div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
<div class="grid gap-5">
<label>اسم الشركة<input id="company_name" class="mt-2 w-full p-3 border rounded-xl"></label>
<label>وصف الشركة<textarea id="description" rows="4" class="mt-2 w-full p-3 border rounded-xl" placeholder="ما الذي تقدمه الشركة؟"></textarea></label>
<div><div class="flex justify-between items-center"><label class="font-semibold">المنتجات والخدمات</label><button type="button" id="addProduct" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">+ إضافة منتج</button></div><p class="text-sm text-slate-500 mt-1 mb-3">أضف اسم المنتج ووصفه وسعره وكلمات تساعد الـAI على التعرف عليه.</p><div id="productsList" class="space-y-3"></div></div><textarea id="products" class="hidden"></textarea>
<label>ماذا تريد من الـAI أن يفعل؟<textarea id="instructions" rows="7" class="mt-2 w-full p-3 border rounded-xl" placeholder="مثال: لو حد قال صلي على النبي رد عليه: عليه الصلاة والسلام. لو التعليق عن شراء منتج أو سعره، رد عليه في الخاص. التعليقات العامة العادية رد عليها في التعليق. لو محتاج موظف، حوّله للرقم الموجود."></textarea><p class="text-sm text-slate-500 mt-2">الـAI يحوّل التعليمات دي تلقائياً إلى Action عند وصول كل رسالة أو تعليق.</p></label>
<div class="grid md:grid-cols-2 gap-5">
<label>لهجة الرد<select id="tone" class="mt-2 w-full p-3 border rounded-xl bg-white">
<option value="مصري عامي">مصري عامي</option><option value="خليجي">خليجي</option><option value="رسمي">رسمي</option>
</select></label>
<label>رقم التحويل لموظف<input id="handover_number" class="mt-2 w-full p-3 border rounded-xl" placeholder="2010..."></label>
</div>
<label class="flex items-center gap-3"><input id="is_active" type="checkbox" class="w-5 h-5" checked><span>تفعيل الرد الآلي</span></label>
<button id="save" class="bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">حفظ الإعدادات</button>
<p id="status" class="text-sm text-center"></p>
</div></div></div>
<script src="config.js"></script>
<script>
const token=localStorage.getItem('whatsauto_token'); if(!token) location.href='login.html';
document.getElementById('logout').onclick=()=>localStorage.removeItem('whatsauto_token');
const ids=['company_name','description','products','instructions','tone','handover_number','is_active'];
function readProducts(){try{return JSON.parse(document.getElementById('products').value||'[]')}catch{return []}}
function renderProducts(items){const box=document.getElementById('productsList');box.innerHTML='';items.forEach((p,i)=>{const row=document.createElement('div');row.className='grid md:grid-cols-4 gap-2 p-3 border rounded-xl bg-slate-50';row.innerHTML=`<input class="pname p-2 border rounded-lg" placeholder="اسم المنتج" value="${p.name||''}"><input class="pdesc p-2 border rounded-lg" placeholder="الوصف" value="${p.description||''}"><input class="pprice p-2 border rounded-lg" placeholder="السعر" value="${p.price||''}"><input class="pkeys p-2 border rounded-lg" placeholder="كلمات مفتاحية، مفصولة بفاصلة" value="${(p.keywords||[]).join(', ')}"><button type="button" class="remove text-red-600 font-bold md:col-span-4">حذف المنتج</button>`;row.querySelector('.remove').onclick=()=>{items.splice(i,1);renderProducts(items)};box.appendChild(row)})}
function collectProducts(){return [...document.querySelectorAll('#productsList>div')].map(row=>({name:row.querySelector('.pname').value.trim(),description:row.querySelector('.pdesc').value.trim(),price:row.querySelector('.pprice').value.trim(),keywords:row.querySelector('.pkeys').value.split(',').map(x=>x.trim()).filter(Boolean)})).filter(x=>x.name)}
document.getElementById('addProduct').onclick=()=>{const items=readProducts();items.push({name:'',description:'',price:'',keywords:[]});renderProducts(items)}
async function load(){
 const r=await fetch(API_BASE_URL+'/api/settings/bot',{headers:{Authorization:'Bearer '+token}});
 if(r.status===401){location.href='login.html';return}
 const d=await r.json(); ids.forEach(id=>{const e=document.getElementById(id); if(e.type==='checkbox')e.checked=d.is_active; else e.value=d[id]||''}); renderProducts(readProducts());
}
document.getElementById('save').onclick=async()=>{
 const b=document.getElementById('save'),s=document.getElementById('status'); b.disabled=true;b.textContent='جاري الحفظ...';
 const body={};ids.forEach(id=>{const e=document.getElementById(id);body[id]=e.type==='checkbox'?e.checked:e.value}); body.products=JSON.stringify(collectProducts()); document.getElementById('products').value=body.products;
 const r=await fetch(API_BASE_URL+'/api/settings/bot',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});
 s.textContent=r.ok?'تم حفظ الإعدادات':'حدث خطأ أثناء الحفظ';s.className=r.ok?'text-green-600 text-sm text-center':'text-red-600 text-sm text-center';
 b.disabled=false;b.textContent='حفظ الإعدادات';
};
load();
</script>
</body></html>
