<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - WhatsAuto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .dir-ltr { direction: ltr; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-l border-slate-200 h-screen p-6 hidden md:flex md:flex-col fixed sticky top-0">
        <div class="text-2xl font-bold text-blue-600 mb-10"><a href="index.html">WhatsAuto</a></div>
        <nav class="space-y-2 flex-1">
            <a href="dashboard.html" class="block px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-lg transition font-medium">الرئيسية</a>
            <a href="settings.html" class="block px-4 py-2 bg-blue-50 text-blue-600 rounded-lg font-bold transition">الإعدادات</a>
            <a href="channels.html" class="block px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-lg transition font-medium">القنوات (WhatsApp & FB)</a>
        </nav>
        <div class="mt-auto">
            <a href="login.html" class="block px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg transition font-medium text-center">تسجيل الخروج</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 w-full overflow-y-auto">
        
        <!-- Mobile Header -->
        <header class="flex md:hidden justify-between items-center mb-8 border-b pb-4">
            <div class="text-xl font-bold text-blue-600">WhatsAuto</div>
            <a href="login.html" class="text-red-500 font-medium text-sm">تسجيل الخروج</a>
        </header>

        <header class="mb-10 hidden md:block">
            <h1 class="text-3xl font-bold text-slate-800">الإعدادات</h1>
        </header>

        <div class="max-w-2xl bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <form class="space-y-6">
                <!-- Company Info -->
                <div>
                    <h2 class="text-xl font-bold mb-4 text-slate-800">معلومات الشركة</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الشركة</label>
                            <input type="text" value="شركتي للتجارة" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">نبذة عن منتجاتك أو خدماتك (يستخدمها البوت للرد)</label>
                            <textarea rows="4" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="نحن شركة تبيع الملابس الجاهزة..."></textarea>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Bot Tone Settings -->
                <div>
                    <h2 class="text-xl font-bold mb-4 text-slate-800">شخصية البوت</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">أسلوب الرد</label>
                            <select class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                                <option>رسمي ومهني (Professional)</option>
                                <option>ودود ومرحب (Friendly)</option>
                                <option>مرح وغير رسمي (Casual)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100">
                
                <div class="flex justify-end pt-2">
                    <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-sm transition">حفظ الإعدادات</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
